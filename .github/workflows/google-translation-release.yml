name: Google translation verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting and test translation providers
        run: ./gradlew ktlintCheck testFdroidDebugUnitTest --tests '*GoogleTranslationTest' --tests '*OpenAIApiTest'
