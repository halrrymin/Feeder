name: Google translation release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.FEEDER_GOOGLE_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/feeder-release.jks"
      - name: Test and build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.FEEDER_GOOGLE_PASSWORD }}
        run: |
          ./gradlew testFdroidDebugUnitTest --tests '*GoogleTranslationTest' assembleFdroidRelease \
            -PSTORE_FILE="$RUNNER_TEMP/feeder-release.jks" \
            -PSTORE_PASSWORD="$SIGNING_PASSWORD" \
            -PKEY_ALIAS=feeder-google -PKEY_PASSWORD="$SIGNING_PASSWORD"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/fdroid/release/*.apk feeder-google-translation.apk
          gh release create "google-translation-${GITHUB_RUN_NUMBER}" feeder-google-translation.apk \
            --target "$GITHUB_SHA" --title "Feeder with Google Translate #${GITHUB_RUN_NUMBER}" \
            --notes 'Unofficial personal build with Google Translate. Signed with a separate key; it cannot replace an official Feeder installation signed by a different key.'
